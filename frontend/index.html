<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Base Bot</title>
<style>
  :root {
    --primary: #1a4d2e;
    --primary-light: #4f7942;
    --bg: #f5f7f4;
    --card: #ffffff;
    --text: #1f2a24;
    --muted: #6b7a6f;
    --border: #d8e0da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  header {
    padding: 24px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    color: var(--primary);
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .panel h2 {
    margin: 0 0 12px;
    font-size: 1.05rem;
    color: var(--primary);
  }
  .upload-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="file"] {
    flex: 1;
    min-width: 200px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fafcfb;
  }
  button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--primary-light); }
  button:disabled { background: #aab8af; cursor: not-allowed; }
  .stats {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .stats strong { color: var(--text); }
  .doc-list {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .doc-list span {
    display: inline-block;
    background: #eef3ec;
    padding: 3px 10px;
    border-radius: 12px;
    margin: 3px 4px 0 0;
  }
  .chat-box {
    min-height: 200px;
    max-height: 480px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    background: #fafcfb;
    margin-bottom: 14px;
  }
  .msg {
    margin-bottom: 16px;
  }
  .msg .label {
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .msg.user .label { color: var(--primary-light); }
  .msg.bot .label { color: var(--primary); }
  .msg .content {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .msg.user .content { background: #eef3ec; }
  .sources {
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .sources span {
    display: inline-block;
    background: #f0ece2;
    border: 1px solid #e2dccb;
    padding: 2px 8px;
    border-radius: 10px;
    margin: 3px 4px 0 0;
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  .input-row input[type="text"] {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
  }
  .status-msg {
    font-size: 0.85rem;
    margin-top: 8px;
  }
  .status-msg.success { color: #2e7d32; }
  .status-msg.error { color: #c62828; }
  .loading {
    color: var(--muted);
    font-style: italic;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📚 Internal Knowledge Base Bot</h1>
    <p>Ask questions about contracts, safety regulations, and project documentation.</p>
  </header>

  <div class="panel">
    <h2>Upload Documents</h2>
    <div class="upload-row">
      <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
      <button id="uploadBtn">Upload &amp; Ingest</button>
      <button id="refreshBtn">Refresh Stats</button>
    </div>
    <div id="uploadStatus" class="status-msg"></div>
    <div class="stats" id="stats"></div>
    <div class="doc-list" id="docList"></div>
  </div>

  <div class="panel">
    <h2>Ask the Knowledge Base</h2>
    <div class="chat-box" id="chatBox">
      <div class="msg bot">
        <div class="label">Bot</div>
        <div class="content">Hi! Upload some documents above, then ask me anything about them.</div>
      </div>
    </div>
    <div class="input-row">
      <input type="text" id="questionInput" placeholder="e.g. What is the liability clause in the Smith contract?" />
      <button id="askBtn">Ask</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8000";

  const fileInput = document.getElementById("fileInput");
  const uploadBtn = document.getElementById("uploadBtn");
  const refreshBtn = document.getElementById("refreshBtn");
  const uploadStatus = document.getElementById("uploadStatus");
  const statsEl = document.getElementById("stats");
  const docListEl = document.getElementById("docList");
  const chatBox = document.getElementById("chatBox");
  const questionInput = document.getElementById("questionInput");
  const askBtn = document.getElementById("askBtn");

  async function loadStats() {
    try {
      const res = await fetch(`${API_BASE}/stats`);
      const data = await res.json();
      statsEl.innerHTML = `<div>Total chunks indexed: <strong>${data.total_chunks}</strong></div>
                           <div>Documents: <strong>${data.documents.length}</strong></div>`;
      if (data.documents.length > 0) {
        docListEl.innerHTML = data.documents.map(d => `<span>${escapeHtml(d)}</span>`).join("");
      } else {
        docListEl.innerHTML = "<em>No documents indexed yet.</em>";
      }
    } catch (err) {
      statsEl.innerHTML = `<span style="color:#c62828">Could not load stats. Is the backend running on ${API_BASE}?</span>`;
    }
  }

  uploadBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) {
      uploadStatus.textContent = "Please select a file first.";
      uploadStatus.className = "status-msg error";
      return;
    }

    const formData = new FormData();
    formData.append("file", file);

    uploadBtn.disabled = true;
    uploadStatus.textContent = "Uploading and indexing... this may take a moment for large PDFs.";
    uploadStatus.className = "status-msg";

    try {
      const res = await fetch(`${API_BASE}/upload`, {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || "Upload failed");
      }

      uploadStatus.textContent = `✅ "${data.filename}" indexed successfully (${data.chunks_added} chunks added).`;
      uploadStatus.className = "status-msg success";
      fileInput.value = "";
      await loadStats();
    } catch (err) {
      uploadStatus.textContent = `❌ Error: ${err.message}`;
      uploadStatus.className = "status-msg error";
    } finally {
      uploadBtn.disabled = false;
    }
  });

  refreshBtn.addEventListener("click", loadStats);

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function addMessage(role, content, sources) {
    const msgDiv = document.createElement("div");
    msgDiv.className = `msg ${role}`;

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "Bot";

    const contentDiv = document.createElement("div");
    contentDiv.className = "content";
    contentDiv.textContent = content;

    msgDiv.appendChild(label);
    msgDiv.appendChild(contentDiv);

    if (sources && sources.length > 0) {
      const sourcesDiv = document.createElement("div");
      sourcesDiv.className = "sources";
      sourcesDiv.innerHTML = "Sources: " + sources.map(s => {
        const pageInfo = (s.page && s.page !== -1) ? ` (p.${s.page})` : "";
        return `<span>${escapeHtml(s.filename)}${pageInfo}</span>`;
      }).join("");
      msgDiv.appendChild(sourcesDiv);
    }

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function askQuestion() {
    const question = questionInput.value.trim();
    if (!question) return;

    addMessage("user", question);
    questionInput.value = "";
    askBtn.disabled = true;

    const loadingDiv = document.createElement("div");
    loadingDiv.className = "msg bot loading-msg";
    loadingDiv.innerHTML = `<div class="label">Bot</div><div class="content loading">Thinking...</div>`;
    chatBox.appendChild(loadingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const res = await fetch(`${API_BASE}/query`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, n_results: 5 })
      });

      const data = await res.json();
      chatBox.removeChild(loadingDiv);

      if (!res.ok) {
        throw new Error(data.detail || "Query failed");
      }

      addMessage("bot", data.answer, data.sources);
    } catch (err) {
      chatBox.removeChild(loadingDiv);
      addMessage("bot", `Error: ${err.message}`);
    } finally {
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener("click", askQuestion);
  questionInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") askQuestion();
  });

  loadStats();
</script>
</body>
</html>
